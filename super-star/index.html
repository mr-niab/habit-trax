<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4c1d95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Super Star">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Super Star ⭐ Gold Star Tracker</title>
<style>
  :root {
    --bg: #1e1b4b;
    --bg2: #312e81;
    --card: #ffffff;
    --ink: #1e1b4b;
    --ink-soft: #6b7280;
    --gold: #fbbf24;
    --gold-deep: #f59e0b;
    --good: #10b981;
    --bad: #ef4444;
    --radius: 20px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 60%, #4c1d95 100%);
    background-attachment: fixed;
    min-height: 100dvh;
    color: var(--ink);
    overscroll-behavior-y: none;
  }
  button { font: inherit; border: 0; cursor: pointer; background: none; }
  input, select { font: inherit; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 32px);
  }

  /* ============ Header ============ */
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(145deg, var(--gold), var(--gold-deep));
    display: grid; place-items: center; font-size: 26px;
    box-shadow: 0 4px 14px rgba(251, 191, 36, .45);
  }
  .brand h1 { font-size: 1.35rem; letter-spacing: .3px; }
  .brand small { display: block; font-size: .72rem; font-weight: 400; opacity: .75; letter-spacing: .5px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px; font-size: 22px;
    background: rgba(255,255,255,.12); color: #fff;
    display: grid; place-items: center;
    transition: transform .15s ease, background .15s ease;
  }
  .icon-btn:active { transform: scale(.92); background: rgba(255,255,255,.22); }

  /* ============ Empty state ============ */
  .empty {
    text-align: center; color: #fff; padding: 56px 24px;
    background: rgba(255,255,255,.07); border-radius: var(--radius);
    border: 2px dashed rgba(255,255,255,.25);
  }
  .empty .big { font-size: 56px; margin-bottom: 12px; animation: floaty 3s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  .empty h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .empty p { opacity: .8; font-size: .92rem; margin-bottom: 20px; }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(145deg, var(--gold), var(--gold-deep));
    color: #451a03; font-weight: 700; font-size: 1rem;
    padding: 14px 26px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(245, 158, 11, .4);
    transition: transform .15s ease;
  }
  .btn-primary:active { transform: scale(.96); }
  .btn-full { width: 100%; }

  /* ============ Child cards ============ */
  .kids { display: grid; gap: 14px; }
  @media (min-width: 640px) { .kids { grid-template-columns: 1fr 1fr; } }

  .kid-card {
    background: var(--card); border-radius: var(--radius);
    padding: 18px 16px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    position: relative; overflow: hidden;
  }
  .kid-card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 6px;
    background: var(--kid-color, var(--gold));
  }
  .kid-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar {
    width: 54px; height: 54px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 30px;
    background: color-mix(in srgb, var(--kid-color, var(--gold)) 22%, white);
    border: 2.5px solid var(--kid-color, var(--gold));
  }
  .kid-name-wrap { min-width: 0; flex: 1; }
  .kid-name { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kid-sub { font-size: .8rem; color: var(--ink-soft); }
  .kid-menu {
    width: 40px; height: 40px; border-radius: 10px; font-size: 20px; color: var(--ink-soft);
    display: grid; place-items: center; flex: none;
  }
  .kid-menu:active { background: #f3f4f6; }

  .star-count {
    text-align: center; margin: 6px 0 14px;
  }
  .star-count .num {
    font-size: 3.4rem; font-weight: 800; line-height: 1;
    background: linear-gradient(160deg, var(--gold-deep), #d97706);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transition: transform .2s ease;
  }
  .star-count .num.pop { animation: pop .45s ease; }
  @keyframes pop { 30% { transform: scale(1.35); } }
  .star-count .label { font-size: .78rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }

  .star-shelf {
    display: flex; flex-wrap: wrap; gap: 3px; justify-content: center;
    min-height: 26px; margin-bottom: 14px; font-size: 19px; line-height: 1.2;
  }
  .star-shelf .dim { opacity: .18; filter: grayscale(1); }
  .star-shelf .more { font-size: .8rem; align-self: center; color: var(--ink-soft); font-weight: 700; margin-left: 4px; }

  .goal-bar { margin-bottom: 14px; }
  .goal-label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 5px; }
  .goal-track { height: 10px; border-radius: 999px; background: #f3f4f6; overflow: hidden; }
  .goal-fill {
    height: 100%; border-radius: 999px; width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-deep));
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }
  .goal-done { color: var(--good); }

  .kid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .act-btn {
    padding: 14px 8px; border-radius: 14px; font-weight: 700; font-size: .95rem;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .12s ease;
    min-height: 52px;
  }
  .act-btn:active { transform: scale(.94); }
  .act-add { background: linear-gradient(145deg, #fde68a, var(--gold)); color: #78350f; box-shadow: 0 4px 12px rgba(251,191,36,.35); }
  .act-remove { background: #fef2f2; color: var(--bad); border: 1.5px solid #fecaca; }

  .kid-history-link {
    display: block; width: 100%; text-align: center; margin-top: 12px;
    font-size: .82rem; color: var(--ink-soft); font-weight: 600; padding: 8px;
    border-radius: 10px;
  }
  .kid-history-link:active { background: #f3f4f6; }

  /* ============ Add-child FAB row ============ */
  .add-kid-row { margin-top: 18px; text-align: center; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    color: #fff; background: rgba(255,255,255,.12);
    padding: 13px 22px; border-radius: 999px; font-weight: 600; font-size: .95rem;
    border: 1.5px solid rgba(255,255,255,.25);
    transition: transform .15s ease;
  }
  .btn-ghost:active { transform: scale(.95); background: rgba(255,255,255,.2); }

  /* ============ Sheet / modal ============ */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(15, 12, 41, .6);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: none; z-index: 40;
    animation: fadeIn .2s ease;
  }
  .sheet-backdrop.open { display: block; }
  @keyframes fadeIn { from { opacity: 0 } }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: #fff; border-radius: 24px 24px 0 0;
    max-width: 560px; margin: 0 auto;
    padding: 10px 20px calc(var(--sab) + 24px);
    transform: translateY(105%);
    transition: transform .3s cubic-bezier(.22,1,.36,1);
    max-height: 88dvh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet .grab { width: 42px; height: 5px; border-radius: 999px; background: #e5e7eb; margin: 4px auto 16px; }
  .sheet h2 { font-size: 1.2rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .sheet .sub { color: var(--ink-soft); font-size: .88rem; margin-bottom: 18px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 7px; }
  .field input[type=text], .field input[type=number] {
    width: 100%; padding: 13px 14px; border-radius: 13px;
    border: 2px solid #e5e7eb; font-size: 1.05rem; background: #f9fafb; color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--gold-deep); background: #fff; }

  .picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 13px; border-radius: 999px; font-size: 1.15rem;
    background: #f3f4f6; border: 2px solid transparent;
    transition: transform .1s ease;
    min-height: 44px; min-width: 44px;
  }
  .chip.txt { font-size: .88rem; font-weight: 600; color: var(--ink); }
  .chip:active { transform: scale(.92); }
  .chip.sel { border-color: var(--gold-deep); background: #fef3c7; }
  .swatch { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; }
  .swatch.sel { border-color: var(--ink); transform: scale(1.1); }

  .sheet-actions { display: grid; gap: 10px; margin-top: 22px; }
  .btn-danger-ghost { color: var(--bad); font-weight: 600; padding: 12px; border-radius: 12px; font-size: .92rem; }
  .btn-danger-ghost:active { background: #fef2f2; }
  .btn-cancel { color: var(--ink-soft); font-weight: 600; padding: 12px; border-radius: 12px; }
  .btn-cancel:active { background: #f3f4f6; }

  /* Reason quick-picks */
  .reason-title { font-size: 1.05rem; font-weight: 700; margin: 4px 0 12px; }
  .reason-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .reason-btn {
    text-align: left; padding: 13px 15px; border-radius: 13px; font-size: .95rem; font-weight: 600;
    background: #f9fafb; border: 1.5px solid #e5e7eb; color: var(--ink);
    display: flex; align-items: center; gap: 10px;
    transition: transform .1s ease;
  }
  .reason-btn:active { transform: scale(.97); background: #fef3c7; }
  .reason-btn .emoji { font-size: 1.25rem; }
  .reason-custom { display: flex; gap: 8px; }
  .reason-custom input { flex: 1; padding: 12px 14px; border-radius: 13px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: .95rem; min-width: 0; }
  .reason-custom input:focus { outline: none; border-color: var(--gold-deep); }
  .reason-custom button {
    padding: 0 18px; border-radius: 13px; font-weight: 700; flex: none;
    background: var(--ink); color: #fff;
  }

  /* ============ History screen ============ */
  .screen { display: none; }
  .screen.active { display: block; }
  .back-row { display: flex; align-items: center; gap: 10px; color: #fff; margin-bottom: 16px; }
  .back-row h2 { font-size: 1.2rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-card { background: #fff; border-radius: var(--radius); padding: 8px 0; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .h-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #f3f4f6; }
  .h-item:last-child { border-bottom: 0; }
  .h-ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; flex: none; }
  .h-ico.plus { background: #fef3c7; }
  .h-ico.minus { background: #fee2e2; }
  .h-body { flex: 1; min-width: 0; }
  .h-reason { font-weight: 600; font-size: .93rem; }
  .h-time { font-size: .76rem; color: var(--ink-soft); margin-top: 1px; }
  .h-delta { font-weight: 800; font-size: 1rem; flex: none; }
  .h-delta.plus { color: var(--gold-deep); }
  .h-delta.minus { color: var(--bad); }
  .h-empty { text-align: center; padding: 36px 20px; color: var(--ink-soft); font-size: .92rem; }
  .h-empty .big { font-size: 40px; margin-bottom: 8px; }

  /* ============ Celebration ============ */
  .burst-star {
    position: fixed; z-index: 100; pointer-events: none;
    font-size: 24px; left: 0; top: 0; will-change: transform, opacity;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--sab) + 24px); transform: translateX(-50%) translateY(120%);
    background: #111827; color: #fff; padding: 12px 22px; border-radius: 999px;
    font-weight: 600; font-size: .92rem; z-index: 90; white-space: nowrap;
    transition: transform .3s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .goal-banner {
    display: none; margin-bottom: 16px; padding: 16px; border-radius: var(--radius);
    background: linear-gradient(145deg, #fde68a, var(--gold));
    color: #78350f; font-weight: 700; text-align: center; font-size: .98rem;
    box-shadow: 0 6px 18px rgba(245,158,11,.45);
    animation: pop .5s ease;
  }
  .goal-banner.show { display: block; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME SCREEN ============ -->
  <div class="screen active" id="screen-home">
    <header>
      <div class="brand">
        <div class="logo">⭐</div>
        <div>
          <h1>Super Star</h1>
          <small>GOLD STAR TRACKER</small>
        </div>
      </div>
      <button class="icon-btn" id="btn-header-add" aria-label="Add child" title="Add child">＋</button>
    </header>

    <div class="goal-banner" id="goal-banner"></div>

    <div id="kid-list" class="kids"></div>

    <div class="empty" id="empty-state" style="display:none">
      <div class="big">🌟</div>
      <h2>No super stars yet!</h2>
      <p>Add your first child to start collecting gold stars.</p>
      <button class="btn-primary" id="btn-empty-add">＋ &nbsp;Add a child</button>
    </div>

    <div class="add-kid-row" id="add-kid-row" style="display:none">
      <button class="btn-ghost" id="btn-add-kid">＋ &nbsp;Add another child</button>
    </div>
  </div>

  <!-- ============ HISTORY SCREEN ============ -->
  <div class="screen" id="screen-history">
    <div class="back-row">
      <button class="icon-btn" id="btn-back" aria-label="Back">‹</button>
      <h2 id="history-title">History</h2>
    </div>
    <div class="history-card">
      <div id="history-list"></div>
    </div>
  </div>
</div>

<!-- ============ SHEET: add / edit child ============ -->
<div class="sheet-backdrop" id="backdrop"></div>

<div class="sheet" id="sheet-child">
  <div class="grab"></div>
  <h2 id="child-sheet-title">🌟 Add a child</h2>
  <p class="sub">Who's collecting gold stars?</p>
  <div class="field">
    <label for="in-name">Name</label>
    <input type="text" id="in-name" placeholder="e.g. Poppy" maxlength="24" autocomplete="off">
  </div>
  <div class="field">
    <label>Avatar</label>
    <div class="picker" id="avatar-picker"></div>
  </div>
  <div class="field">
    <label>Colour</label>
    <div class="picker" id="color-picker"></div>
  </div>
  <div class="field">
    <label for="in-goal">Star goal &nbsp;<span style="text-transform:none;font-weight:400">(reward when reached)</span></label>
    <input type="number" id="in-goal" inputmode="numeric" min="1" max="999" placeholder="e.g. 10">
  </div>
  <div class="sheet-actions">
    <button class="btn-primary btn-full" id="btn-save-child">Save</button>
    <button class="btn-danger-ghost" id="btn-delete-child" style="display:none">Remove this child</button>
    <button class="btn-cancel" data-close>Cancel</button>
  </div>
</div>

<!-- ============ SHEET: reason picker ============ -->
<div class="sheet" id="sheet-reason">
  <div class="grab"></div>
  <h2 id="reason-heading">⭐ Add a gold star</h2>
  <p class="sub" id="reason-sub">What did they do?</p>
  <div class="reason-list" id="reason-list"></div>
  <div class="reason-custom">
    <input type="text" id="in-reason" placeholder="Or type your own…" maxlength="60" autocomplete="off">
    <button id="btn-reason-go">Go</button>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" data-close>Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------- state ---------- */
  const STORE_KEY = "superstar.v1";
  const AVATARS = ["🦄","🦖","🐯","🐸","🦊","🐼","🐰","🦁","🐙","🚀","🧜‍♀️","🦸","🐶","🐱","🦋","⚽️"];
  const COLORS = ["#f59e0b","#ec4899","#8b5cf6","#3b82f6","#10b981","#ef4444","#14b8a6","#f97316"];
  const GOOD_REASONS = [
    ["🛏️","Tidied their room"],
    ["📚","Did their homework"],
    ["💖","Was kind to someone"],
    ["🥦","Ate all their dinner"],
    ["🪥","Brushed teeth without a fuss"],
    ["🤝","Helped around the house"],
    ["😴","Went to bed nicely"],
    ["🎉","Just being brilliant"],
  ];
  const BAD_REASONS = [
    ["🙉","Didn't listen"],
    ["😤","Had a tantrum"],
    ["🥊","Fought with sibling"],
    ["🙅","Wouldn't tidy up"],
    ["📵","Too much screen-time fuss"],
    ["😬","Was rude or unkind"],
  ];

  let state = load();
  let editingId = null;      // child being edited in the child sheet (null = adding new)
  let reasonCtx = null;      // { kidId, delta } while the reason sheet is open
  let selAvatar = AVATARS[0];
  let selColor = COLORS[0];
  let currentHistoryKid = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.kids)) return parsed;
      }
    } catch (e) { /* corrupted store — start fresh */ }
    return { kids: [] };
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function kidById(id) { return state.kids.find(k => k.id === id); }

  /* ---------- dom helpers ---------- */
  const $ = (sel) => document.querySelector(sel);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- rendering ---------- */
  function render() {
    const list = $("#kid-list");
    list.innerHTML = "";
    const has = state.kids.length > 0;
    $("#empty-state").style.display = has ? "none" : "";
    $("#add-kid-row").style.display = has ? "" : "none";
    state.kids.forEach(kid => list.appendChild(renderKid(kid)));
  }

  function renderKid(kid) {
    const card = el("article", "kid-card");
    card.style.setProperty("--kid-color", kid.color);
    card.dataset.id = kid.id;

    const top = el("div", "kid-top");
    const av = el("div", "avatar", kid.avatar);
    const nameWrap = el("div", "kid-name-wrap");
    nameWrap.appendChild(el("div", "kid-name", kid.name));
    nameWrap.appendChild(el("div", "kid-sub", subline(kid)));
    const menu = el("button", "kid-menu", "✎");
    menu.setAttribute("aria-label", "Edit " + kid.name);
    menu.addEventListener("click", () => openChildSheet(kid.id));
    top.append(av, nameWrap, menu);

    const count = el("div", "star-count");
    const num = el("div", "num", String(kid.stars));
    num.dataset.count = kid.id;
    count.appendChild(num);
    count.appendChild(el("div", "label", kid.stars === 1 ? "gold star" : "gold stars"));

    const shelf = el("div", "star-shelf");
    buildShelf(shelf, kid);

    const goal = buildGoal(kid);

    const actions = el("div", "kid-actions");
    const addBtn = el("button", "act-btn act-add", "⭐ Add star");
    addBtn.addEventListener("click", () => openReasonSheet(kid.id, +1));
    const remBtn = el("button", "act-btn act-remove", "✖ Remove star");
    remBtn.disabled = kid.stars <= 0;
    if (remBtn.disabled) remBtn.style.opacity = ".45";
    remBtn.addEventListener("click", () => openReasonSheet(kid.id, -1));
    actions.append(addBtn, remBtn);

    const hist = el("button", "kid-history-link", "View history ›");
    hist.addEventListener("click", () => openHistory(kid.id));

    card.append(top, count, shelf);
    if (goal) card.appendChild(goal);
    card.append(actions, hist);
    return card;
  }

  function subline(kid) {
    const today = kid.history.filter(h => isToday(h.t)).reduce((s, h) => s + h.d, 0);
    if (today > 0) return `+${today} today 🎉`;
    if (today < 0) return `${today} today`;
    return "No stars yet today";
  }

  function buildShelf(shelf, kid) {
    const MAX = 12;
    const shown = Math.min(kid.stars, MAX);
    for (let i = 0; i < shown; i++) shelf.appendChild(el("span", null, "⭐"));
    if (kid.stars > MAX) shelf.appendChild(el("span", "more", "+" + (kid.stars - MAX)));
    if (kid.stars === 0) {
      for (let i = 0; i < 3; i++) shelf.appendChild(el("span", "dim", "⭐"));
    }
  }

  function buildGoal(kid) {
    if (!kid.goal) return null;
    const wrap = el("div", "goal-bar");
    const label = el("div", "goal-label");
    const done = kid.stars >= kid.goal;
    const left = el("span", done ? "goal-done" : null, done ? "🏆 Goal reached!" : "Reward goal");
    const right = el("span", done ? "goal-done" : null, Math.min(kid.stars, kid.goal) + " / " + kid.goal);
    label.append(left, right);
    const track = el("div", "goal-track");
    const fill = el("div", "goal-fill");
    track.appendChild(fill);
    wrap.append(label, track);
    requestAnimationFrame(() => {
      fill.style.width = Math.min(100, (kid.stars / kid.goal) * 100) + "%";
    });
    return wrap;
  }

  function isToday(ts) {
    const d = new Date(ts), n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  /* ---------- star add / remove ---------- */
  function applyStar(kidId, delta, reason) {
    const kid = kidById(kidId);
    if (!kid) return;
    if (delta < 0 && kid.stars <= 0) return;
    kid.stars = Math.max(0, kid.stars + delta);
    kid.history.unshift({ t: Date.now(), d: delta, r: reason });
    if (kid.history.length > 300) kid.history.length = 300;
    save();
    render();

    if (delta > 0) {
      burst();
      toast(`⭐ Gold star for ${kid.name}!`);
      if (kid.goal && kid.stars === kid.goal) celebrateGoal(kid);
    } else {
      toast(`Star removed from ${kid.name}`);
    }
    const num = document.querySelector(`.num[data-count="${kid.id}"]`);
    if (num) { num.classList.add("pop"); setTimeout(() => num.classList.remove("pop"), 500); }
  }

  function celebrateGoal(kid) {
    const b = $("#goal-banner");
    b.textContent = `🏆 ${kid.name} reached ${kid.goal} stars — reward time!`;
    b.classList.add("show");
    burst(); setTimeout(burst, 250); setTimeout(burst, 500);
    setTimeout(() => b.classList.remove("show"), 6000);
  }

  /* ---------- celebration burst ---------- */
  function burst() {
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2.5;
    const n = 14;
    for (let i = 0; i < n; i++) {
      const s = el("div", "burst-star", Math.random() < .8 ? "⭐" : "🌟");
      document.body.appendChild(s);
      const ang = (Math.PI * 2 * i) / n + Math.random() * .4;
      const dist = 90 + Math.random() * 130;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 40;
      const dur = 700 + Math.random() * 400;
      s.animate([
        { transform: `translate(${cx}px, ${cy}px) scale(.4) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${cx + dx}px, ${cy + dy}px) scale(1.15) rotate(${(Math.random() - .5) * 360}deg)`, opacity: 0 }
      ], { duration: dur, easing: "cubic-bezier(.17,.67,.4,1)" }).onfinish = () => s.remove();
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ---------- sheets ---------- */
  function openSheet(id) {
    $("#backdrop").classList.add("open");
    $(id).classList.add("open");
  }
  function closeSheets() {
    $("#backdrop").classList.remove("open");
    document.querySelectorAll(".sheet").forEach(s => s.classList.remove("open"));
    reasonCtx = null;
  }
  $("#backdrop").addEventListener("click", closeSheets);
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheets));

  /* ---------- child sheet ---------- */
  function buildPickers() {
    const ap = $("#avatar-picker");
    ap.innerHTML = "";
    AVATARS.forEach(a => {
      const c = el("button", "chip" + (a === selAvatar ? " sel" : ""), a);
      c.addEventListener("click", () => { selAvatar = a; buildPickers(); });
      ap.appendChild(c);
    });
    const cp = $("#color-picker");
    cp.innerHTML = "";
    COLORS.forEach(col => {
      const c = el("button", "chip swatch" + (col === selColor ? " sel" : ""));
      c.style.background = col;
      c.setAttribute("aria-label", "Colour " + col);
      c.addEventListener("click", () => { selColor = col; buildPickers(); });
      cp.appendChild(c);
    });
  }

  function openChildSheet(id) {
    editingId = id || null;
    const kid = id ? kidById(id) : null;
    $("#child-sheet-title").textContent = kid ? "✏️ Edit " + kid.name : "🌟 Add a child";
    $("#in-name").value = kid ? kid.name : "";
    $("#in-goal").value = kid && kid.goal ? kid.goal : "";
    selAvatar = kid ? kid.avatar : AVATARS[Math.floor(Math.random() * AVATARS.length)];
    selColor = kid ? kid.color : COLORS[state.kids.length % COLORS.length];
    $("#btn-delete-child").style.display = kid ? "" : "none";
    buildPickers();
    openSheet("#sheet-child");
    if (!kid) setTimeout(() => $("#in-name").focus(), 350);
  }

  $("#btn-save-child").addEventListener("click", () => {
    const name = $("#in-name").value.trim();
    if (!name) { $("#in-name").focus(); toast("Give them a name first 😊"); return; }
    const goalRaw = parseInt($("#in-goal").value, 10);
    const goal = (goalRaw >= 1 && goalRaw <= 999) ? goalRaw : null;
    if (editingId) {
      const kid = kidById(editingId);
      if (kid) Object.assign(kid, { name, avatar: selAvatar, color: selColor, goal });
    } else {
      state.kids.push({ id: uid(), name, avatar: selAvatar, color: selColor, goal, stars: 0, history: [] });
      toast(`Welcome, ${name}! 🌟`);
    }
    save(); render(); closeSheets();
  });

  $("#btn-delete-child").addEventListener("click", () => {
    const kid = kidById(editingId);
    if (!kid) return;
    if (!confirm(`Remove ${kid.name} and all their stars? This can't be undone.`)) return;
    state.kids = state.kids.filter(k => k.id !== editingId);
    save(); render(); closeSheets();
    toast(`${kid.name} removed`);
  });

  /* ---------- reason sheet ---------- */
  function openReasonSheet(kidId, delta) {
    const kid = kidById(kidId);
    if (!kid) return;
    reasonCtx = { kidId, delta };
    const plus = delta > 0;
    $("#reason-heading").textContent = plus ? `⭐ Gold star for ${kid.name}` : `✖ Remove a star from ${kid.name}`;
    $("#reason-sub").textContent = plus ? "What did they do well?" : "What happened?";
    const list = $("#reason-list");
    list.innerHTML = "";
    (plus ? GOOD_REASONS : BAD_REASONS).forEach(([emoji, text]) => {
      const b = el("button", "reason-btn");
      b.appendChild(el("span", "emoji", emoji));
      b.appendChild(el("span", null, text));
      b.addEventListener("click", () => { commitReason(text); });
      list.appendChild(b);
    });
    $("#in-reason").value = "";
    openSheet("#sheet-reason");
  }

  function commitReason(text) {
    if (!reasonCtx) return;
    const { kidId, delta } = reasonCtx;
    closeSheets();
    applyStar(kidId, delta, text);
  }

  $("#btn-reason-go").addEventListener("click", () => {
    const t = $("#in-reason").value.trim();
    commitReason(t || (reasonCtx && reasonCtx.delta > 0 ? "Being great" : "Misbehaved"));
  });
  $("#in-reason").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); $("#btn-reason-go").click(); }
  });

  /* ---------- history ---------- */
  function openHistory(kidId) {
    const kid = kidById(kidId);
    if (!kid) return;
    currentHistoryKid = kidId;
    $("#history-title").textContent = `${kid.avatar} ${kid.name}'s history`;
    const list = $("#history-list");
    list.innerHTML = "";
    if (!kid.history.length) {
      const e = el("div", "h-empty");
      e.appendChild(el("div", "big", "📖"));
      e.appendChild(el("div", null, "Nothing here yet — go earn some stars!"));
      list.appendChild(e);
    } else {
      kid.history.forEach(h => {
        const row = el("div", "h-item");
        const ico = el("div", "h-ico " + (h.d > 0 ? "plus" : "minus"), h.d > 0 ? "⭐" : "✖");
        const body = el("div", "h-body");
        body.appendChild(el("div", "h-reason", h.r || (h.d > 0 ? "Gold star" : "Star removed")));
        body.appendChild(el("div", "h-time", fmtTime(h.t)));
        const delta = el("div", "h-delta " + (h.d > 0 ? "plus" : "minus"), (h.d > 0 ? "+" : "") + h.d);
        row.append(ico, body, delta);
        list.appendChild(row);
      });
    }
    $("#screen-home").classList.remove("active");
    $("#screen-history").classList.add("active");
    window.scrollTo(0, 0);
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (isToday(ts)) return "Today · " + time;
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    if (d.toDateString() === yest.toDateString()) return "Yesterday · " + time;
    return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + " · " + time;
  }

  $("#btn-back").addEventListener("click", () => {
    currentHistoryKid = null;
    $("#screen-history").classList.remove("active");
    $("#screen-home").classList.add("active");
  });

  /* ---------- wire up ---------- */
  $("#btn-header-add").addEventListener("click", () => openChildSheet(null));
  $("#btn-empty-add").addEventListener("click", () => openChildSheet(null));
  $("#btn-add-kid").addEventListener("click", () => openChildSheet(null));

  render();
})();
</script>
</body>
</html>
